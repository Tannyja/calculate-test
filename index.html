<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Calculator</title>
    <!-- ════════════════════════════════════ -->
    <!-- ╔═ DESIGN & CODE BY: jaotannyja ═╗ -->
    <!-- ╚════════════════════════════════╝ -->
</head>
<body>
    

    <div class="wrapper">
        <div class="calculator-container">
            <div class="calculator">
                <section class="expression-bar" id="expression"></section>
                <section class="screen" id="screen">0</section>
                <section class="calc-buttons">
        <div class="calc-button-row">
            <button class="calc-button clear">
                C
            </button>
            <button class="calc-button">
                &larr;
            </button>
            <button class="calc-button operator">
                &divide;
            </button>
        </div>
        
        <div class="calc-button-row">
            <button class="calc-button">
                7
            </button>
            <button class="calc-button">
                8
            </button>
            <button class="calc-button">
                9
            </button>
            <button class="calc-button operator">
                &times;
            </button>
        </div>
        <div class="calc-button-row">
            <button class="calc-button">
                4
            </button>
            <button class="calc-button">
                5
            </button>
            <button class="calc-button">
                6
            </button>
            <button class="calc-button operator">
                &minus;
            </button>
        </div>

        <div class="calc-button-row">
            <button class="calc-button">
                1
            </button>
            <button class="calc-button">
                2
            </button>
            <button class="calc-button">
                3
            </button>
            <button class="calc-button operator">
                &plus;
            </button>
        </div>

        <div class="calc-button-row">
            <button class="calc-button triple">
                0
            </button>
            <button class="calc-button operator">
                &equals;
            </button>
        </div>

        
        
    </section>
            </div>
            <div class="history-panel">
                <h3>ประวัติ</h3>
                <ul id="history-list" class="history-list"></ul>
            </div>
        </div>
    </div>


    <script src="script.js"></script>
</body>
</html>
